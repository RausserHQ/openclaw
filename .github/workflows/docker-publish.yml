name: Publish Docker image

on:
  push:
    branches:
      - main
      - base/openclaw-2026.6.11
    tags:
      - "rausser-*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: ghcr.io/rausserhq/openclaw

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Pre-pull BuildKit image
        shell: bash
        env:
          BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if docker pull "${BUILDKIT_IMAGE}"; then
              exit 0
            fi
            if [[ "${attempt}" == "4" ]]; then
              echo "::error::Failed to pull ${BUILDKIT_IMAGE} after ${attempt} attempts"
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            echo "BuildKit image pull failed; retrying in ${sleep_seconds}s (${attempt}/4)."
            sleep "${sleep_seconds}"
          done

      - name: Set up Docker Builder
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tags=("${IMAGE_NAME}:sha-${GITHUB_SHA::12}")
          if [[ "${SOURCE_REF}" == "refs/heads/main" ]]; then
            tags+=("${IMAGE_NAME}:main")
          fi
          if [[ "${SOURCE_REF}" == "refs/heads/base/openclaw-2026.6.11" ]]; then
            tags+=("${IMAGE_NAME}:baseline")
          fi
          if [[ "${SOURCE_REF}" == refs/tags/rausser-* ]]; then
            tags+=("${IMAGE_NAME}:${SOURCE_REF_NAME}")
          fi
          {
            echo "value<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve OCI labels
        id: labels
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${GITHUB_SHA}"
          if [[ "${SOURCE_REF}" == "refs/heads/main" ]]; then
            version="main"
          fi
          if [[ "${SOURCE_REF}" == "refs/heads/base/openclaw-2026.6.11" ]]; then
            version="baseline"
          fi
          if [[ "${SOURCE_REF}" == refs/tags/rausser-* ]]; then
            version="${SOURCE_REF_NAME}"
          fi
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "value<<EOF"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.created=${created}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          cache-from: type=gha,scope=rausser-openclaw-docker-amd64
          cache-to: type=gha,mode=max,scope=rausser-openclaw-docker-amd64
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ steps.labels.outputs.value }}
          push: true

      - name: Print published tags
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.value }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Published image digest: ${IMAGE_DIGEST}"
          echo "Published image tags:"
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            echo "- ${tag}"
          done <<< "${IMAGE_TAGS}"
          {
            echo "### Published Docker image"
            echo
            echo "Digest: \`${IMAGE_DIGEST}\`"
            echo
            echo "Tags:"
            while IFS= read -r tag; do
              [[ -n "${tag}" ]] || continue
              echo "- \`${tag}\`"
            done <<< "${IMAGE_TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"
